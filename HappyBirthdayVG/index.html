<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="story" id="story">
  <i class="glow a"></i>
  <i class="glow b"></i>
  <i class="glow c"></i>
  <div class="texture"></div>

  <div class="sky">
    <i class="spark" style="top:24%;left:15%"></i>
    <i class="spark" style="top:52%;right:12%;animation-delay:-3s"></i>
    <i class="spark" style="top:73%;left:23%;animation-delay:-5s"></i>
    <i class="spark" style="top:12%;right:30%;animation-delay:-1.5s"></i>
    <i class="spark" style="top:85%;right:38%;animation-delay:-4s"></i>
    <i class="star" style="top:28%;left:10%"></i>
    <i class="star" style="bottom:22%;right:11%"></i>
    <i class="star" style="top:47%;right:8%"></i>
    <i class="star" style="top:8%;left:42%"></i>
    <i class="star" style="bottom:10%;left:34%"></i>
  </div>

  <svg class="const" viewBox="0 0 150 105">
    <line x1="16" y1="79" x2="45" y2="54"/>
    <line x1="45" y1="54" x2="72" y2="63"/>
    <line x1="72" y1="63" x2="101" y2="32"/>
    <line x1="101" y1="32" x2="130" y2="43"/>
    <circle cx="16" cy="79" r="2.5"/>
    <circle cx="45" cy="54" r="2.2"/>
    <circle cx="72" cy="63" r="2.8"/>
    <circle cx="101" cy="32" r="2.2"/>
    <circle cx="130" cy="43" r="2.4"/>
  </svg>

  <svg class="const const2" viewBox="0 0 150 105">
    <line x1="16" y1="79" x2="45" y2="54"/>
    <line x1="45" y1="54" x2="72" y2="63"/>
    <line x1="72" y1="63" x2="101" y2="32"/>
    <circle cx="16" cy="79" r="2.5"/>
    <circle cx="45" cy="54" r="2.2"/>
    <circle cx="72" cy="63" r="2.8"/>
    <circle cx="101" cy="32" r="2.2"/>
  </svg>

  <svg class="const const3" viewBox="0 0 150 105">
    <line x1="10" y1="20" x2="40" y2="45"/>
    <line x1="40" y1="45" x2="75" y2="30"/>
    <circle cx="10" cy="20" r="2.2"/>
    <circle cx="40" cy="45" r="2.5"/>
    <circle cx="75" cy="30" r="2.2"/>
  </svg>

  <div id="archeryScene" class="archery-scene">
    <p class="archery-title">a little something, for you</p>

    <div class="archery-field">
      <div class="gift-target" id="giftTarget">
        <div class="gift-glow"></div>
        <span class="gift-emoji">🎁</span>
      </div>

      <svg class="bow-svg" viewBox="0 0 50 170" preserveAspectRatio="none">
        <path d="M35 6 Q6 85 35 164" fill="none" stroke="#8c5bc7" stroke-width="4" stroke-linecap="round"/>
        <line id="stringTop" x1="35" y1="6" x2="35" y2="85" stroke="#a97fdb" stroke-width="2"/>
        <line id="stringBottom" x1="35" y1="164" x2="35" y2="85" stroke="#a97fdb" stroke-width="2"/>
      </svg>

      <div class="arrow" id="arrow">
        <span class="arrow-line"></span>
        <span class="arrow-tip">➤</span>
      </div>
    </div>

    <p class="archery-hint">pull &amp; release</p>
    <p class="archery-date">September 12, 2026</p>
  </div>

  <div class="wrap">
    <header class="celebrate">
      <div class="bunting">
        <i class="flag"></i><i class="flag"></i><i class="flag"></i>
        <i class="flag"></i><i class="flag"></i><i class="flag"></i><i class="flag"></i>
      </div>
      <p class="date">September 12</p>
      <div class="icons">
        <i class="balloon"></i>
        <i class="cake"></i>
        <i class="balloon"></i>
      </div>
    </header>

    <section class="intro">
      <p class="label">Its Your Special Day</p>
      <h1 id="first"></h1>
      <p class="happy">Happy Birthday! 💜</p>
      <button id="open" class="open">Open this</button>
      <div class="music-controls">
  <button id="musicBtn" class="music-btn">Play this, please</button>
  <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
</div>
    </section>

    <section class="note">
      <h1 class="name" id="second"></h1>
      <p class="kicker"> Hope you have a wonderful day and a great year ahead.</p>
      <article class="card">
        <h2>Happy Birthday, <span id="third"></span> 💜</h2>
        <p id="message"></p>
      </article>
      <div id="candleScene" class="candle-scene">
  <div class="candle">
    <div class="flame" id="flame"></div>
    <div class="smoke" id="smoke"></div>
  </div>
  <p class="candle-hint">Tap the flame to blow it out</p>
</div>

<button id="wishBtn" class="open wish-btn" style="display:none;">Make a wish</button>

<div id="wishOverlay" class="wish-overlay">
<form id="wishBox" class="wish-box" name="wish" method="POST">
  <input type="hidden" name="access_key" value="5fef93f7-13d0-41bf-808a-b500be76fb91">
  <input type="hidden" name="subject" value="New wish from Happy Birthday page">
    <button type="button" id="wishClose" class="wish-close">&times;</button>
    <h2>Make a wish</h2>
    <textarea id="wishInput" name="wish" placeholder="Type your wish here..." rows="3" required></textarea>
    <button id="wishSubmit" type="submit" class="open">Send my wish</button>
    <p id="wishThanks" class="wish-thanks"></p>
  </form>
</div>
    </section>

    <p class="bottom" style="text-align:center">Happy Birthday po :) 💜</p>
  </div>
</main>

<audio id="bgMusic" src="vg.mp4" loop></audio>
<script src="script.js"></script>
</body>
</html>
